<title>Nystan</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<meta name="theme-color" content="#e9a23b" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap"
/>
<style>
  /* Layout: one full-screen canvas, knitted saffron ground, HUD drawn in-canvas. Single warm look. */
  :root {
    --knit: #e9a23b;
    --ink: #1b1420;
    color-scheme: light;
  }
  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--knit);
    color: var(--ink);
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: pointer;
  }
</style>

<canvas id="game" aria-label="Nystan: dra för att styra hunden och fånga garn"></canvas>

<script>
  (() => {
    const cv = document.getElementById('game');
    const ctx = cv.getContext('2d');
    const FONT = "'Baloo 2', 'Trebuchet MS', system-ui, sans-serif";
    const YARN = ['#ff5d8f', '#3bb7b0', '#7b5cff', '#ff6b3d', '#4f8ef7', '#9bd34a'];
    const INK = '#1b1420';
    const CREAM = '#fff4dc';
    const GOLD = '#ffd23f';
    const PINK = '#ff5d8f';
    const DANGER = '#ff3b3b';
    const LEVEL_SECONDS = 20;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let W = 0,
      H = 0,
      DPR = 1,
      U = 1; // U = base unit, scales with screen
    let knitPattern = null;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2.5);
      W = window.innerWidth;
      H = window.innerHeight;
      cv.width = Math.round(W * DPR);
      cv.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      U = Math.min(W, H * 0.62) / 100;
      knitPattern = makeKnit();
      if (dog) dog.y = groundY();
    }

    function makeKnit() {
      const s = Math.max(14, Math.round(U * 5));
      const c = document.createElement('canvas');
      c.width = s * 2;
      c.height = s * 2;
      const g = c.getContext('2d');
      g.fillStyle = '#e9a23b';
      g.fillRect(0, 0, c.width, c.height);
      g.strokeStyle = 'rgba(160, 95, 20, 0.28)';
      g.lineWidth = s * 0.22;
      g.lineCap = 'round';
      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 2; col++) {
          const x = col * s,
            y = row * s;
          g.beginPath();
          g.moveTo(x + s * 0.12, y + s * 0.15);
          g.quadraticCurveTo(x + s * 0.3, y + s * 0.85, x + s * 0.5, y + s * 0.85);
          g.quadraticCurveTo(x + s * 0.7, y + s * 0.85, x + s * 0.88, y + s * 0.15);
          g.stroke();
        }
      }
      return ctx.createPattern(c, 'repeat');
    }

    function safeBottom() {
      return parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0;
    }
    function safeTop() {
      return parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
    }
    const groundY = () => H - Math.max(18, H * 0.06) - safeBottom();

    // ---------- audio ----------
    let ac = null,
      muted = false;
    function audio() {
      if (!ac) {
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          ac = null;
        }
      }
      if (ac && ac.state === 'suspended') ac.resume();
    }
    function tone(freq, dur = 0.1, type = 'sine', vol = 0.18, slide = 0, delay = 0) {
      if (!ac || muted) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    }
    const sfx = {
      catch: (c) => tone(440 * Math.pow(2, Math.min(c, 14) / 12), 0.09, 'triangle', 0.2, 120),
      banana: (c) => {
        const f = 520 * Math.pow(2, Math.min(c, 14) / 12);
        tone(f, 0.07, 'triangle', 0.18, 80);
        tone(f * 1.5, 0.1, 'triangle', 0.16, 120, 0.07);
      },
      gold: () => {
        tone(330, 0.08, 'square', 0.12, -60);
        tone(260, 0.12, 'square', 0.12, -80, 0.11);
      },
      bone: () => tone(660, 0.18, 'sine', 0.2, 300),
      hurt: () => tone(160, 0.3, 'sawtooth', 0.18, -100),
      miss: () => tone(220, 0.08, 'sine', 0.08, -60),
      level: () => {
        tone(523, 0.1, 'triangle', 0.16);
        tone(659, 0.1, 'triangle', 0.16, 0, 0.1);
        tone(784, 0.18, 'triangle', 0.16, 0, 0.2);
      },
      over: () => {
        tone(392, 0.15, 'triangle', 0.18);
        tone(311, 0.15, 'triangle', 0.18, 0, 0.16);
        tone(233, 0.35, 'triangle', 0.18, -40, 0.32);
      },
    };
    function buzz(ms) {
      try {
        navigator.vibrate && navigator.vibrate(ms);
      } catch (e) {}
    }

    // keep the screen awake while playing (optional)
    let wakeLock = null;
    async function keepAwake(on) {
      try {
        if (on && !wakeLock && navigator.wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => (wakeLock = null));
        } else if (!on && wakeLock) {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (e) {
        wakeLock = null;
      }
    }

    // ---------- storage ----------
    function loadBest() {
      try {
        return parseInt(localStorage.getItem('nystan-best') || '0', 10) || 0;
      } catch (e) {
        return 0;
      }
    }
    function saveBest(v) {
      try {
        localStorage.setItem('nystan-best', String(v));
      } catch (e) {}
    }

    // ---------- state ----------
    let state = 'menu'; // menu | play | paused | over
    let best = loadBest();
    let newBest = false;
    let score, lives, combo, maxCombo, items, parts, popups, t, spawnT, zoomies, shake, overAt;
    let level, banner;
    let dog = null;
    let targetX = null;
    let drag = null; // { startX, dogX } for relative touch steering
    const keys = { left: false, right: false };

    function reset() {
      score = 0;
      lives = 3;
      combo = 0;
      maxCombo = 0;
      items = [];
      parts = [];
      popups = [];
      t = 0;
      spawnT = 0.6;
      zoomies = 0;
      shake = 0;
      level = 1;
      banner = null;
      dog = { x: W / 2, y: groundY(), vx: 0, wag: 0, chomp: 0, hurt: 0, face: 1 };
      targetX = W / 2;
    }

    function start() {
      audio();
      reset();
      state = 'play';
      keepAwake(true);
    }
    function pause() {
      if (state !== 'play') return;
      state = 'paused';
      drag = null;
      keepAwake(false);
    }
    function resume() {
      if (state !== 'paused') return;
      state = 'play';
      last = performance.now();
      keepAwake(true);
    }

    // ---------- spawning ----------
    const GOOD = ['yarn', 'banana', 'gold', 'bone'];
    const isHazard = (k) => k === 'scissors' || k === 'pencil';

    function spawn(forceKind) {
      let kind = forceKind;
      if (!kind) {
        const r = Math.random();
        const hazardP = Math.min(0.34, 0.14 + t * 0.0032);
        if (r < hazardP) kind = Math.random() < 0.5 ? 'scissors' : 'pencil';
        else if (r < hazardP + 0.045) kind = 'gold';
        else if (r < hazardP + 0.075 && lives < 3) kind = 'bone';
        else if (r < hazardP + 0.2) kind = 'banana';
        else kind = 'yarn';
      }
      const size = (kind === 'yarn' ? 6.5 + Math.random() * 2 : 7) * U;
      let speed = H * (0.28 + Math.min(t, 100) * 0.0075) * (0.85 + Math.random() * 0.3);
      if (kind === 'pencil') speed *= 1.2; // pencils drop like darts
      items.push({
        kind,
        x: size + Math.random() * (W - size * 2),
        y: -size * 2.5,
        r: size,
        vy: speed,
        vx: kind === 'pencil' ? 0 : (Math.random() - 0.5) * U * 8,
        rot: kind === 'pencil' ? 0 : Math.random() * 6.28,
        vr: kind === 'pencil' ? 0 : (Math.random() - 0.5) * 4,
        wob: Math.random() * 6.28,
        color: YARN[(Math.random() * YARN.length) | 0],
      });
    }

    function burst(x, y, color, n = 12, power = 1) {
      if (reduceMotion) n = Math.ceil(n / 3);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (40 + Math.random() * 160) * power;
        parts.push({
          x,
          y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s - 80,
          life: 0.5 + Math.random() * 0.4,
          max: 0.9,
          color,
          len: 4 + Math.random() * 8,
          rot: a,
        });
      }
    }
    function popup(x, y, text, color = CREAM, size = 7) {
      popups.push({ x, y, text, color, size, life: 0.9 });
    }

    // ---------- input ----------
    function canRestart() {
      return performance.now() - overAt > 700;
    }
    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      audio();
      const x = e.clientX,
        y = e.clientY;
      if (hitBox(muteBox(), x, y)) {
        muted = !muted;
        return;
      }
      if ((state === 'play' || state === 'paused') && hitBox(pauseBox(), x, y)) {
        state === 'play' ? pause() : resume();
        return;
      }
      if (state === 'menu') start();
      else if (state === 'over' && canRestart()) start();
      else if (state === 'paused') resume();
      if (state === 'play') {
        drag = { startX: x, dogX: dog.x, id: e.pointerId };
        try {
          cv.setPointerCapture(e.pointerId);
        } catch (err) {}
      }
    });
    cv.addEventListener('pointermove', (e) => {
      if (state !== 'play') return;
      if (drag && drag.id === e.pointerId) {
        // relative steering: the finger never covers the dog
        const gain = e.pointerType === 'mouse' ? 1 : 1.5;
        targetX = drag.dogX + (e.clientX - drag.startX) * gain;
      } else if (e.pointerType === 'mouse') {
        targetX = e.clientX;
      }
    });
    const endDrag = (e) => {
      if (drag && drag.id === e.pointerId) drag = null;
    };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === ' ' || e.key === 'Enter') {
        if (state === 'menu') start();
        else if (state === 'over' && canRestart()) start();
        else if (state === 'paused') resume();
      }
      if (e.key === 'p' || e.key === 'Escape') state === 'play' ? pause() : resume();
      if (e.key === 'm') muted = !muted;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });
    window.addEventListener('resize', resize);
    window.addEventListener('blur', pause);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pause();
      last = performance.now();
    });

    function btnSize() {
      return Math.max(38, U * 9);
    }
    function muteBox() {
      const s = btnSize();
      return { x: W - s - Math.max(16, U * 4), y: safeTop() + Math.max(58, U * 15), s };
    }
    function pauseBox() {
      const m = muteBox();
      return { x: m.x - m.s - 10, y: m.y, s: m.s };
    }
    function hitBox(b, x, y) {
      const pad = 6;
      return x >= b.x - pad && x <= b.x + b.s + pad && y >= b.y - pad && y <= b.y + b.s + pad;
    }

    // ---------- update ----------
    function update(dt) {
      const now = performance.now();
      if (state === 'paused') return;

      // dog movement
      if (keys.left || keys.right) {
        targetX = dog.x + (keys.right - keys.left) * W * 1.4 * dt;
      }
      const dogW = 15 * U;
      targetX = Math.max(dogW, Math.min(W - dogW, targetX));
      if (drag) drag.dogX = Math.max(dogW - 40 * U, Math.min(W - dogW + 40 * U, drag.dogX));
      const prev = dog.x;
      if (state === 'play') dog.x += (targetX - dog.x) * Math.min(1, dt * 18);
      else dog.x += (W / 2 - dog.x) * Math.min(1, dt * 2);
      dog.vx = (dog.x - prev) / Math.max(dt, 0.001);
      if (Math.abs(dog.vx) > 20) dog.face = dog.vx > 0 ? 1 : -1;
      dog.y = groundY();
      dog.wag += dt * (zoomies > 0 ? 30 : 14);
      dog.chomp = Math.max(0, dog.chomp - dt * 5);
      dog.hurt = Math.max(0, dog.hurt - dt);
      shake = Math.max(0, shake - dt * 2.5);

      for (const p of parts) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 500 * dt;
        p.life -= dt;
      }
      parts = parts.filter((p) => p.life > 0);
      for (const p of popups) {
        p.y -= 50 * dt;
        p.life -= dt;
      }
      popups = popups.filter((p) => p.life > 0);
      if (banner) {
        banner.life -= dt;
        if (banner.life <= 0) banner = null;
      }

      if (state !== 'play') {
        if (state === 'menu') {
          // ambient falling treats behind the title
          spawnT -= dt;
          if (spawnT <= 0) {
            spawnT = 0.7;
            spawn(Math.random() < 0.25 ? 'banana' : 'yarn');
            items[items.length - 1].vy *= 0.6;
          }
          for (const it of items) {
            it.y += it.vy * dt;
            it.rot += it.vr * dt;
          }
          items = items.filter((it) => it.y < H + it.r * 3);
        }
        return;
      }

      t += dt;
      zoomies = Math.max(0, zoomies - dt);
      const lvl = 1 + Math.floor(t / LEVEL_SECONDS);
      if (lvl > level) {
        level = lvl;
        banner = { text: `Nivå ${level}`, life: 1.6 };
        sfx.level();
        buzz(30);
      }
      spawnT -= dt;
      if (spawnT <= 0) {
        spawn();
        if (t > 25 && Math.random() < Math.min(0.35, t * 0.006)) spawn();
        spawnT = Math.max(0.3, 0.85 - t * 0.011);
      }

      const mouth = mouthPos();
      const catchR = 10 * U + (zoomies > 0 ? 5 * U : 0);

      for (const it of items) {
        if (zoomies > 0 && !isHazard(it.kind)) {
          const dx = mouth.x - it.x;
          it.vx += Math.sign(dx) * Math.min(Math.abs(dx) * 6, U * 260) * dt;
          it.vx *= 0.96;
        }
        it.x += it.vx * dt;
        it.y += it.vy * dt;
        it.rot += it.vr * dt;
        it.wob += dt * 6;
        if (it.kind === 'pencil') it.rot = Math.sin(it.wob) * 0.18;
        if (it.x < it.r || it.x > W - it.r) it.vx *= -1;

        const dx = it.x - mouth.x,
          dy = it.y - mouth.y;
        const reach = catchR + it.r * (isHazard(it.kind) ? 0.55 : 0.7);
        const invulnerable = isHazard(it.kind) && dog.hurt > 0;
        if (!it.done && !invulnerable && dx * dx + dy * dy < reach * reach) {
          it.done = true;
          collect(it);
        } else if (!it.done && it.y > dog.y + it.r) {
          it.done = true;
          if (it.kind === 'yarn' || it.kind === 'gold' || it.kind === 'banana') {
            if (combo >= 3) popup(it.x, dog.y - 6 * U, 'Kedjan bröts', INK, 5);
            combo = 0;
            sfx.miss();
          }
          burst(it.x, dog.y, itemColor(it), isHazard(it.kind) ? 6 : 5, 0.5);
        }
      }
      items = items.filter((it) => !it.done);
    }

    function itemColor(it) {
      if (it.kind === 'gold') return GOLD;
      if (it.kind === 'banana') return '#ffe14d';
      if (it.kind === 'scissors') return '#c9d1dc';
      if (it.kind === 'pencil') return '#f6c431';
      if (it.kind === 'bone') return CREAM;
      return it.color;
    }

    function collect(it) {
      dog.chomp = 1;
      if (isHazard(it.kind)) {
        lives--;
        combo = 0;
        dog.hurt = 1.2; // brief invulnerability
        shake = 1;
        sfx.hurt();
        buzz([60, 40, 60]);
        burst(it.x, it.y, itemColor(it), 16, 1.2);
        popup(it.x, it.y, it.kind === 'pencil' ? 'Stick!' : 'Aj!', DANGER, 9);
        if (lives <= 0) gameOver();
        return;
      }
      if (it.kind === 'bone') {
        lives = Math.min(3, lives + 1);
        sfx.bone();
        buzz(20);
        burst(it.x, it.y, CREAM, 14);
        popup(it.x, it.y, '+1 liv', CREAM, 7);
        return;
      }
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      const mult = 1 + Math.floor(combo / 5);
      const base = it.kind === 'gold' ? 10 : it.kind === 'banana' ? 3 : 1;
      const pts = base * mult * (zoomies > 0 ? 2 : 1);
      score += pts;
      if (it.kind === 'gold') {
        zoomies = 5;
        sfx.gold();
        buzz(40);
        burst(it.x, it.y, GOLD, 26, 1.4);
        popup(it.x, it.y - 4 * U, 'VOFF! Zoomies!', GOLD, 9);
      } else if (it.kind === 'banana') {
        sfx.banana(combo);
        buzz(15);
        burst(it.x, it.y, '#ffe14d', 14);
        popup(it.x, it.y, '+' + pts + ' banan!', '#ffe14d', 7);
      } else {
        sfx.catch(combo);
        buzz(10);
        burst(it.x, it.y, it.color, 12);
        popup(it.x, it.y, '+' + pts, CREAM, combo >= 5 ? 8 : 6.5);
      }
    }

    function gameOver() {
      state = 'over';
      drag = null;
      overAt = performance.now();
      sfx.over();
      buzz(200);
      keepAwake(false);
      newBest = score > best;
      if (newBest) {
        best = score;
        saveBest(best);
      }
      items = items.filter((it) => !isHazard(it.kind));
    }

    // ---------- drawing: items ----------
    function drawYarn(it, color) {
      const r = it.r;
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1.5, r * 0.12);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.9);
      const w = Math.sin(performance.now() / 120 + it.x) * r * 0.5;
      ctx.bezierCurveTo(w, -r * 1.6, -w, -r * 2.0, w * 0.6, -r * 2.6);
      ctx.stroke();
      ctx.rotate(it.rot);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,0.22)';
      ctx.lineWidth = Math.max(1, r * 0.09);
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.ellipse(i * r * 0.28, 0, r * 0.35, r * 1.2, 0.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.ellipse(0, i * r * 0.35, r * 1.2, r * 0.3, -0.4, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(-r * 0.35, -r * 0.35, r * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBanana(it) {
      const r = it.r * 1.15;
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot);
      ctx.lineJoin = 'round';
      // crescent body
      ctx.beginPath();
      ctx.moveTo(-r, -r * 0.35);
      ctx.quadraticCurveTo(-r * 0.1, r * 1.05, r, -r * 0.35);
      ctx.quadraticCurveTo(r * 0.05, r * 0.45, -r, -r * 0.35);
      ctx.closePath();
      ctx.fillStyle = '#ffe14d';
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, r * 0.11);
      ctx.strokeStyle = '#5a3d0a';
      ctx.stroke();
      // ridge
      ctx.strokeStyle = 'rgba(200, 140, 20, 0.7)';
      ctx.lineWidth = Math.max(1, r * 0.06);
      ctx.beginPath();
      ctx.moveTo(-r * 0.75, -r * 0.18);
      ctx.quadraticCurveTo(-r * 0.05, r * 0.72, r * 0.75, -r * 0.18);
      ctx.stroke();
      // stem and tip
      ctx.fillStyle = '#5a3d0a';
      ctx.beginPath();
      ctx.ellipse(r * 1.02, -r * 0.42, r * 0.12, r * 0.2, 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-r, -r * 0.35, r * 0.09, 0, Math.PI * 2);
      ctx.fill();
      // shine
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = Math.max(1, r * 0.08);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-r * 0.45, r * 0.12);
      ctx.quadraticCurveTo(-r * 0.15, r * 0.4, r * 0.15, r * 0.35);
      ctx.stroke();
      ctx.restore();
    }

    function hazardHalo(r) {
      const pulse = 0.16 + 0.06 * Math.sin(performance.now() / 110);
      ctx.fillStyle = `rgba(255, 59, 59, ${pulse})`;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawScissors(it) {
      const r = it.r;
      ctx.save();
      ctx.translate(it.x, it.y);
      hazardHalo(r * 1.3);
      ctx.rotate(it.rot);
      ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.save();
        ctx.rotate(s * 0.32);
        ctx.fillStyle = '#dfe5ec';
        ctx.strokeStyle = '#5b6470';
        ctx.lineWidth = Math.max(1, r * 0.08);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(s * r * 0.18, -r * 1.3);
        ctx.lineTo(-s * r * 0.08, -r * 1.25);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = '#e8343f';
        ctx.lineWidth = r * 0.2;
        ctx.beginPath();
        ctx.ellipse(-s * r * 0.05, r * 0.7, r * 0.3, r * 0.42, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = '#5b6470';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPencil(it) {
      const r = it.r;
      const L = r * 2.8,
        w = r * 0.62;
      ctx.save();
      ctx.translate(it.x, it.y);
      hazardHalo(r * 1.45);
      ctx.rotate(it.rot);
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(1.5, r * 0.09);
      ctx.strokeStyle = INK;
      const top = -L / 2,
        bodyEnd = L / 2 - r * 0.85;
      // eraser
      ctx.fillStyle = '#ff8fb1';
      roundRect(-w / 2, top, w, r * 0.45, w * 0.3);
      ctx.fill();
      ctx.stroke();
      // ferrule
      ctx.fillStyle = '#b8c0c8';
      ctx.fillRect(-w / 2, top + r * 0.4, w, r * 0.32);
      ctx.strokeRect(-w / 2, top + r * 0.4, w, r * 0.32);
      // body
      ctx.fillStyle = '#f6c431';
      ctx.fillRect(-w / 2, top + r * 0.72, w, bodyEnd - (top + r * 0.72));
      ctx.fillStyle = 'rgba(180, 110, 0, 0.35)';
      ctx.fillRect(w / 6, top + r * 0.72, w / 3, bodyEnd - (top + r * 0.72));
      ctx.strokeRect(-w / 2, top + r * 0.72, w, bodyEnd - (top + r * 0.72));
      // sharpened wood + graphite tip (pointing down)
      ctx.fillStyle = '#f1c89a';
      ctx.beginPath();
      ctx.moveTo(-w / 2, bodyEnd);
      ctx.lineTo(w / 2, bodyEnd);
      ctx.lineTo(0, L / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#2b2b2b';
      ctx.beginPath();
      ctx.moveTo(-w * 0.17, L / 2 - r * 0.3);
      ctx.lineTo(w * 0.17, L / 2 - r * 0.3);
      ctx.lineTo(0, L / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBone(it) {
      const r = it.r;
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot);
      ctx.fillStyle = CREAM;
      ctx.strokeStyle = '#b78a4a';
      ctx.lineWidth = Math.max(1, r * 0.1);
      ctx.beginPath();
      ctx.rect(-r * 0.8, -r * 0.22, r * 1.6, r * 0.44);
      for (const sx of [-1, 1])
        for (const sy of [-1, 1]) {
          ctx.moveTo(sx * r * 0.85 + r * 0.32, sy * r * 0.25);
          ctx.arc(sx * r * 0.85, sy * r * 0.25, r * 0.32, 0, Math.PI * 2);
        }
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = PINK;
      ctx.font = `800 ${r * 0.7}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+', 0, 1);
      ctx.restore();
    }

    function drawItem(it) {
      if (it.kind === 'yarn') drawYarn(it, it.color);
      else if (it.kind === 'gold') {
        drawYarn(it, GOLD);
        ctx.save();
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 90);
        text('✦', it.x + it.r, it.y - it.r, it.r * 0.9, '#fff', 'center', 800, false);
        ctx.restore();
      } else if (it.kind === 'banana') drawBanana(it);
      else if (it.kind === 'scissors') drawScissors(it);
      else if (it.kind === 'pencil') drawPencil(it);
      else drawBone(it);
    }

    // ---------- drawing: the dog (Chodský pes) ----------
    // A shaggy outline: alternating tufts around an ellipse.
    function furBlob(cx, cy, rx, ry, n, tuft, seed, from = 0, to = Math.PI * 2) {
      const full = to - from >= Math.PI * 2 - 0.001;
      const steps = n * 2;
      const pt = (i) => {
        const a = from + ((to - from) * i) / steps;
        const k = i % 2 ? 1 + tuft * (0.75 + 0.45 * Math.sin(i * 1.7 + seed)) : 1;
        return [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k];
      };
      let [x0, y0] = pt(0);
      ctx.moveTo(x0, y0);
      for (let i = 1; i < steps; i += 2) {
        const [qx, qy] = pt(i);
        const [ex, ey] = pt(i + 1);
        ctx.quadraticCurveTo(qx, qy, ex, ey);
      }
      if (full) ctx.closePath();
    }

    function drawDog() {
      const s = U;
      const x = dog.x,
        y = dog.y;
      const f = dog.face;
      const lean = Math.max(-0.16, Math.min(0.16, dog.vx / (W * 6)));
      const moving = Math.min(1, Math.abs(dog.vx) / 300);
      const hop = state === 'play' ? Math.abs(Math.sin(dog.wag * 0.5)) * moving * 2 * s : 0;
      const blink = dog.hurt > 0 || performance.now() % 3400 < 120;
      const BLACK = '#141118';
      const COAT = '#221d27';
      const SHEEN = 'rgba(190, 175, 210, 0.22)';

      ctx.save();
      // shadow
      ctx.fillStyle = 'rgba(90, 50, 10, 0.25)';
      ctx.beginPath();
      ctx.ellipse(x, y + 1 * s, 16 * s, 3 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(x, y - hop);
      ctx.rotate(lean);
      if (dog.hurt > 0 && Math.floor(dog.hurt * 14) % 2 === 0) {
        ctx.restore(); // blink: skip the dog this frame, keep the shadow
        return;
      }

      if (zoomies > 0) {
        ctx.save();
        ctx.globalAlpha = 0.25 + 0.15 * Math.sin(performance.now() / 80);
        ctx.fillStyle = GOLD;
        ctx.beginPath();
        ctx.arc(0, -16 * s, 24 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // bushy sabre tail, carried low and swishing
      const wag = Math.sin(dog.wag) * 0.45;
      ctx.save();
      ctx.translate(-f * 8 * s, -4 * s);
      ctx.rotate(-f * (1.15 + wag));
      ctx.fillStyle = BLACK;
      ctx.beginPath();
      furBlob(-f * 1 * s, -8 * s, 3.6 * s, 8.5 * s, 9, 0.28, 2);
      ctx.fill();
      ctx.strokeStyle = SHEEN;
      ctx.lineWidth = Math.max(1, 0.5 * s);
      ctx.beginPath();
      ctx.moveTo(-f * 0.5 * s, -2 * s);
      ctx.quadraticCurveTo(-f * 2 * s, -8 * s, -f * 1 * s, -14 * s);
      ctx.stroke();
      ctx.restore();

      // body: long dense coat
      ctx.fillStyle = BLACK;
      ctx.beginPath();
      furBlob(0, -8 * s, 11.5 * s, 9.5 * s, 14, 0.13, 1);
      ctx.fill();

      // hind haunches
      for (const hx of [-1, 1]) {
        ctx.beginPath();
        furBlob(hx * 8 * s, -3.5 * s, 4.6 * s, 4 * s, 7, 0.16, hx * 3);
        ctx.fill();
      }

      // front legs with feathering
      for (const lx of [-1, 1]) {
        ctx.fillStyle = BLACK;
        ctx.beginPath();
        ctx.moveTo(lx * 2 * s, -12 * s);
        ctx.lineTo(lx * 6.2 * s, -12 * s);
        ctx.lineTo(lx * 5.8 * s, -1.5 * s);
        ctx.lineTo(lx * 2.4 * s, -1.5 * s);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        furBlob(lx * 6.2 * s, -6 * s, 1.2 * s, 5 * s, 5, 0.5, lx, -Math.PI / 2, Math.PI / 2);
        ctx.fill();
        // paw
        ctx.fillStyle = COAT;
        ctx.beginPath();
        ctx.ellipse(lx * 4.1 * s, -1 * s, 2.6 * s, 1.5 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = BLACK;
        ctx.lineWidth = Math.max(1, 0.35 * s);
        ctx.beginPath();
        ctx.moveTo(lx * 3.4 * s, -1.6 * s);
        ctx.lineTo(lx * 3.4 * s, -0.2 * s);
        ctx.moveTo(lx * 4.8 * s, -1.6 * s);
        ctx.lineTo(lx * 4.8 * s, -0.2 * s);
        ctx.stroke();
      }

      // mane / ruff around the neck
      const hx = f * 1.5 * s,
        hy = -25 * s;
      ctx.fillStyle = BLACK;
      ctx.beginPath();
      furBlob(hx * 0.5, -17 * s, 10 * s, 8 * s, 13, 0.2, 4);
      ctx.fill();

      // coat sheen strands
      ctx.strokeStyle = SHEEN;
      ctx.lineWidth = Math.max(1, 0.55 * s);
      ctx.lineCap = 'round';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 2.6 * s + hx * 0.3, -19 * s);
        ctx.quadraticCurveTo(i * 3.2 * s, -14 * s, i * 2.4 * s, -10 * s);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(-8 * s, -11 * s);
      ctx.quadraticCurveTo(-9.5 * s, -7 * s, -8 * s, -3 * s);
      ctx.moveTo(8 * s, -11 * s);
      ctx.quadraticCurveTo(9.5 * s, -7 * s, 8 * s, -3 * s);
      ctx.stroke();

      // collar
      ctx.strokeStyle = '#e8343f';
      ctx.lineWidth = 2 * s;
      ctx.beginPath();
      ctx.arc(hx, hy - 1 * s, 8.6 * s, 0.33 * Math.PI, 0.67 * Math.PI);
      ctx.stroke();
      ctx.fillStyle = GOLD;
      ctx.beginPath();
      ctx.arc(hx, hy + 8.6 * s, 1.5 * s, 0, Math.PI * 2);
      ctx.fill();

      // erect, pointed ears
      const perk = zoomies > 0 ? -0.1 : Math.sin(dog.wag * 0.5) * 0.05;
      for (const ex of [-1, 1]) {
        ctx.save();
        ctx.translate(hx + ex * 4.2 * s, hy - 4.5 * s);
        ctx.rotate(ex * (0.32 + perk));
        ctx.fillStyle = BLACK;
        ctx.beginPath();
        ctx.moveTo(-3 * s, 1 * s);
        ctx.quadraticCurveTo(-1.2 * s, -6 * s, 0, -8.6 * s);
        ctx.quadraticCurveTo(1.2 * s, -6 * s, 3 * s, 1 * s);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#3d2c3b';
        ctx.beginPath();
        ctx.moveTo(-1.6 * s, 0);
        ctx.quadraticCurveTo(-0.6 * s, -4.4 * s, 0, -6.4 * s);
        ctx.quadraticCurveTo(0.6 * s, -4.4 * s, 1.6 * s, 0);
        ctx.closePath();
        ctx.fill();
        // inner fur tuft
        ctx.strokeStyle = BLACK;
        ctx.lineWidth = Math.max(1, 0.4 * s);
        ctx.beginPath();
        ctx.moveTo(-1 * s, 0.4 * s);
        ctx.lineTo(0.2 * s, -2.4 * s);
        ctx.moveTo(0.8 * s, 0.4 * s);
        ctx.lineTo(-0.2 * s, -2 * s);
        ctx.stroke();
        ctx.restore();
      }

      // head: broad skull, cheek fur, tapering wedge muzzle
      ctx.fillStyle = BLACK;
      ctx.beginPath();
      furBlob(hx, hy, 7.4 * s, 6.6 * s, 10, 0.1, 7, Math.PI * 0.05, Math.PI * 0.95);
      ctx.lineTo(hx - 7.2 * s, hy - 1 * s);
      ctx.quadraticCurveTo(hx - 6.5 * s, hy - 7 * s, hx, hy - 7 * s);
      ctx.quadraticCurveTo(hx + 6.5 * s, hy - 7 * s, hx + 7.2 * s, hy - 1 * s);
      ctx.closePath();
      ctx.fill();

      // muzzle
      const mx = hx + f * 0.6 * s;
      ctx.fillStyle = COAT;
      ctx.beginPath();
      ctx.moveTo(mx - 3.6 * s, hy + 0.5 * s);
      ctx.quadraticCurveTo(mx - 3.2 * s, hy + 6 * s, mx, hy + 7.4 * s);
      ctx.quadraticCurveTo(mx + 3.2 * s, hy + 6 * s, mx + 3.6 * s, hy + 0.5 * s);
      ctx.quadraticCurveTo(mx, hy - 1.5 * s, mx - 3.6 * s, hy + 0.5 * s);
      ctx.fill();
      // stop line between the eyes
      ctx.strokeStyle = SHEEN;
      ctx.lineWidth = Math.max(1, 0.5 * s);
      ctx.beginPath();
      ctx.moveTo(mx, hy - 5 * s);
      ctx.lineTo(mx, hy - 1.5 * s);
      ctx.stroke();

      // mouth / tongue (drawn before the nose)
      const open = 1 + dog.chomp * 1.8 + (zoomies > 0 ? 0.6 : 0);
      ctx.fillStyle = '#5a1730';
      ctx.beginPath();
      ctx.ellipse(mx, hy + 7.6 * s, 2 * s, 0.9 * s * open, 0, 0, Math.PI * 2);
      ctx.fill();
      if (dog.hurt <= 0) {
        ctx.fillStyle = PINK;
        ctx.beginPath();
        ctx.ellipse(
          mx + f * 0.3 * s,
          hy + 8.6 * s + open * 0.7 * s,
          1.4 * s,
          1.9 * s,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
        ctx.strokeStyle = '#d63a6c';
        ctx.lineWidth = Math.max(1, 0.3 * s);
        ctx.beginPath();
        ctx.moveTo(mx + f * 0.3 * s, hy + 8 * s + open * 0.7 * s);
        ctx.lineTo(mx + f * 0.3 * s, hy + 9.6 * s + open * 0.7 * s);
        ctx.stroke();
      }

      // nose
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.moveTo(mx - 1.7 * s, hy + 5 * s);
      ctx.quadraticCurveTo(mx, hy + 4.2 * s, mx + 1.7 * s, hy + 5 * s);
      ctx.quadraticCurveTo(mx + 1 * s, hy + 6.8 * s, mx, hy + 6.8 * s);
      ctx.quadraticCurveTo(mx - 1 * s, hy + 6.8 * s, mx - 1.7 * s, hy + 5 * s);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(mx - 0.5 * s, hy + 5.1 * s, 0.4 * s, 0, Math.PI * 2);
      ctx.fill();

      // almond eyes that track the nearest falling thing
      let look = { x: 0, y: -1 };
      let nearest = null,
        nd = 1e9;
      for (const it of items) {
        const d = Math.abs(it.x - x) + (H - it.y) * 0.3;
        if (d < nd) {
          nd = d;
          nearest = it;
        }
      }
      if (nearest) {
        const dx = nearest.x - (x + hx),
          dy = nearest.y - (y + hy);
        const m = Math.hypot(dx, dy) || 1;
        look = { x: dx / m, y: dy / m };
      }
      for (const ex of [-1, 1]) {
        const cx = hx + ex * 3 * s + f * 0.4 * s,
          cy = hy - 2 * s;
        if (blink) {
          ctx.strokeStyle = CREAM;
          ctx.lineWidth = Math.max(1, 0.7 * s);
          ctx.beginPath();
          if (dog.hurt > 0) {
            ctx.moveTo(cx - 1.2 * s, cy - 1 * s);
            ctx.lineTo(cx + 1.2 * s, cy + 1 * s);
            ctx.moveTo(cx + 1.2 * s, cy - 1 * s);
            ctx.lineTo(cx - 1.2 * s, cy + 1 * s);
          } else {
            ctx.moveTo(cx - 1.5 * s, cy);
            ctx.quadraticCurveTo(cx, cy + 0.8 * s, cx + 1.5 * s, cy);
          }
          ctx.stroke();
        } else {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(ex * -0.18);
          ctx.fillStyle = '#f3e3c4';
          ctx.beginPath();
          ctx.ellipse(0, 0, 2.1 * s, 1.6 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.fillStyle = '#4a2a14';
          ctx.beginPath();
          ctx.arc(cx + look.x * 0.7 * s, cy + look.y * 0.5 * s, 1.25 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(cx + look.x * 0.8 * s, cy + look.y * 0.6 * s, 0.6 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(
            cx + look.x * 0.7 * s - 0.4 * s,
            cy + look.y * 0.5 * s - 0.45 * s,
            0.4 * s,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function mouthPos() {
      return { x: dog.x + dog.face * 2 * U, y: dog.y - 19 * U };
    }

    // ---------- drawing: UI ----------
    function text(str, x, y, size, color, align = 'center', weight = 800, outline = true) {
      ctx.font = `${weight} ${size}px ${FONT}`;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      if (outline) {
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(3, size * 0.16);
        ctx.strokeStyle = INK;
        ctx.strokeText(str, x, y);
      }
      ctx.fillStyle = color;
      ctx.fillText(str, x, y);
    }

    function heart(x, y, r, full) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.moveTo(0, r * 0.35);
      ctx.bezierCurveTo(-r * 1.1, -r * 0.4, -r * 0.5, -r * 1.1, 0, -r * 0.45);
      ctx.bezierCurveTo(r * 0.5, -r * 1.1, r * 1.1, -r * 0.4, 0, r * 0.35);
      ctx.closePath();
      ctx.fillStyle = full ? PINK : 'rgba(27,20,32,0.25)';
      ctx.fill();
      ctx.lineWidth = Math.max(2, r * 0.14);
      ctx.strokeStyle = INK;
      ctx.stroke();
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function button(b) {
      ctx.fillStyle = 'rgba(27,20,32,0.3)';
      roundRect(b.x, b.y, b.s, b.s, b.s * 0.3);
      ctx.fill();
    }

    function drawSpeaker(cx, cy, r) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = CREAM;
      ctx.strokeStyle = CREAM;
      ctx.lineWidth = Math.max(1.5, r * 0.22);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-r, -r * 0.4);
      ctx.lineTo(-r * 0.4, -r * 0.4);
      ctx.lineTo(r * 0.15, -r);
      ctx.lineTo(r * 0.15, r);
      ctx.lineTo(-r * 0.4, r * 0.4);
      ctx.lineTo(-r, r * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      if (muted) {
        ctx.moveTo(r * 0.5, -r * 0.45);
        ctx.lineTo(r * 1.1, r * 0.45);
        ctx.moveTo(r * 1.1, -r * 0.45);
        ctx.lineTo(r * 0.5, r * 0.45);
      } else {
        ctx.arc(r * 0.3, 0, r * 0.6, -0.8, 0.8);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawPauseIcon(cx, cy, r, playing) {
      ctx.fillStyle = CREAM;
      if (playing) {
        ctx.fillRect(cx - r * 0.7, cy - r, r * 0.5, r * 2);
        ctx.fillRect(cx + r * 0.2, cy - r, r * 0.5, r * 2);
      } else {
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.6, cy - r);
        ctx.lineTo(cx + r, cy);
        ctx.lineTo(cx - r * 0.6, cy + r);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawHUD() {
      const top = safeTop() + Math.max(14, U * 4);
      const side = Math.max(16, U * 4);
      const big = Math.max(28, U * 9);
      text(String(score), side, top + big * 0.5, big, CREAM, 'left');
      const sub = Math.max(14, big * 0.45);
      if (combo >= 2) {
        const mult = 1 + Math.floor(combo / 5);
        text(
          `${combo} i rad${mult > 1 ? '  ×' + mult : ''}`,
          side,
          top + big * 1.25,
          sub,
          mult > 1 ? GOLD : CREAM,
          'left'
        );
      } else {
        text(`Nivå ${level}`, side, top + big * 1.25, sub, CREAM, 'left', 800);
      }
      const hr = Math.max(10, U * 3.2);
      for (let i = 0; i < 3; i++)
        heart(W - side - hr - i * hr * 2.6, top + big * 0.5, hr, i < lives);
      if (zoomies > 0) {
        const bw = Math.min(W * 0.5, 220),
          bh = Math.max(8, U * 2);
        const bx = (W - bw) / 2,
          by = top + big * 2.1;
        ctx.fillStyle = 'rgba(27,20,32,0.35)';
        roundRect(bx, by, bw, bh, bh / 2);
        ctx.fill();
        ctx.fillStyle = GOLD;
        roundRect(bx, by, Math.max(bh, (bw * zoomies) / 5), bh, bh / 2);
        ctx.fill();
        text('ZOOMIES ×2', W / 2, by - bh * 1.3, Math.max(14, U * 3.6), GOLD);
      }
      const m = muteBox();
      button(m);
      drawSpeaker(m.x + m.s / 2, m.y + m.s / 2, m.s * 0.28);
      const p = pauseBox();
      button(p);
      drawPauseIcon(p.x + p.s / 2, p.y + p.s / 2, p.s * 0.25, state === 'play');
    }

    function panel(h) {
      const pw = Math.min(W - 32, 380);
      const px = (W - pw) / 2,
        py = Math.max(safeTop() + 16, H * 0.42 - h / 2);
      ctx.fillStyle = 'rgba(27,20,32,0.88)';
      roundRect(px, py, pw, h, 22);
      ctx.fill();
      ctx.strokeStyle = PINK;
      ctx.setLineDash([10, 7]);
      ctx.lineWidth = 3;
      roundRect(px + 7, py + 7, pw - 14, h - 14, 16);
      ctx.stroke();
      ctx.setLineDash([]);
      return { px, py, pw };
    }

    function pulseText(str, x, y, size, color) {
      const pulse = reduceMotion ? 1 : 1 + Math.sin(performance.now() / 250) * 0.04;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      text(str, 0, 0, size, color);
      ctx.restore();
    }

    // icon legend: what to catch and what to dodge
    function legendRow(kinds, label, labelColor, cx, y, sz, pw) {
      text(label, cx, y, sz * 0.28, labelColor, 'center', 800, false);
      const gap = Math.min(pw / (kinds.length + 1), sz * 1.25);
      const r = sz * 0.22;
      const now = performance.now() / 1000;
      kinds.forEach((k, i) => {
        const ix = cx + (i - (kinds.length - 1) / 2) * gap;
        const iy = y + sz * 0.62;
        const it = {
          kind: k,
          x: ix,
          y: iy + (k === 'pencil' ? r * 0.1 : 0),
          r: k === 'pencil' ? r * 0.75 : r,
          rot: k === 'pencil' ? Math.sin(now * 3 + i) * 0.15 : Math.sin(now * 2 + i) * 0.3,
          color: YARN[i % YARN.length],
        };
        drawItem(it);
      });
    }

    function drawMenu() {
      const sz = Math.min(W / 6.2, 70);
      const h = sz * 6.6;
      const { py, pw } = panel(h);
      text('NYSTAN', W / 2, py + sz * 0.95, sz * 1.15, GOLD);
      text(
        'Sotis vill ha allt garn.',
        W / 2,
        py + sz * 1.85,
        sz * 0.36,
        CREAM,
        'center',
        600,
        false
      );
      legendRow(
        ['yarn', 'banana', 'gold', 'bone'],
        'FÅNGA',
        '#9bd34a',
        W / 2,
        py + sz * 2.55,
        sz,
        pw
      );
      legendRow(['scissors', 'pencil'], 'AKTA DIG', DANGER, W / 2, py + sz * 3.95, sz, pw);
      text(
        'Dra var som helst för att styra',
        W / 2,
        py + sz * 5.25,
        sz * 0.3,
        '#c7b9d6',
        'center',
        600,
        false
      );
      pulseText('Tryck för att spela', W / 2, py + sz * 5.95, sz * 0.48, PINK);
      if (best > 0)
        text(`Rekord: ${best}`, W / 2, py + h + 26, sz * 0.36, INK, 'center', 800, false);
    }

    function drawOver() {
      const sz = Math.min(W / 6.2, 70);
      const { py } = panel(sz * 4.9);
      text('Klippt!', W / 2, py + sz * 0.9, sz, PINK);
      text(String(score), W / 2, py + sz * 2.05, sz * 1.25, CREAM);
      text(
        newBest ? 'Nytt rekord!' : `Rekord: ${best}`,
        W / 2,
        py + sz * 2.95,
        sz * 0.4,
        newBest ? GOLD : '#c7b9d6',
        'center',
        800,
        false
      );
      text(
        `Nivå ${level} · längsta kedja ${maxCombo}`,
        W / 2,
        py + sz * 3.45,
        sz * 0.3,
        '#c7b9d6',
        'center',
        600,
        false
      );
      if (canRestart()) pulseText('Tryck för att köra igen', W / 2, py + sz * 4.2, sz * 0.42, GOLD);
    }

    function drawPaused() {
      const sz = Math.min(W / 6.2, 70);
      const { py } = panel(sz * 2.6);
      text('Paus', W / 2, py + sz * 0.95, sz, GOLD);
      pulseText('Tryck för att fortsätta', W / 2, py + sz * 1.9, sz * 0.42, CREAM);
    }

    function drawBanner() {
      if (!banner) return;
      const a = Math.min(1, banner.life * 2, (1.6 - banner.life) * 6);
      const sz = Math.min(W / 5, 80);
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      const sc = reduceMotion ? 1 : 1 + (1.6 - banner.life) * 0.08;
      ctx.translate(W / 2, H * 0.36);
      ctx.scale(sc, sc);
      text(banner.text, 0, 0, sz, GOLD);
      text('Snabbare nu!', 0, sz * 0.75, sz * 0.32, CREAM);
      ctx.restore();
    }

    function draw() {
      ctx.save();
      if (shake > 0 && !reduceMotion) {
        const m = shake * U * 2.5;
        ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
      }
      ctx.fillStyle = knitPattern || '#e9a23b';
      ctx.fillRect(-20, -20, W + 40, H + 40);

      // floor: woven basket rug
      const gy = groundY();
      ctx.fillStyle = '#b5691f';
      ctx.fillRect(-20, gy, W + 40, H - gy + 20);
      ctx.fillStyle = '#9a5719';
      for (let x = -20; x < W + 20; x += 18) ctx.fillRect(x, gy + 6, 9, 5);
      ctx.fillStyle = '#c97c2a';
      ctx.fillRect(-20, gy, W + 40, 4);

      for (const it of items) drawItem(it);
      drawDog();

      for (const p of parts) {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(2, U * 0.9);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.quadraticCurveTo(
          p.x + Math.cos(p.rot + 1) * p.len,
          p.y + Math.sin(p.rot + 1) * p.len,
          p.x + Math.cos(p.rot) * p.len * 1.5,
          p.y + Math.sin(p.rot) * p.len * 1.5
        );
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      for (const p of popups) {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        text(p.text, p.x, p.y, p.size * U, p.color);
      }
      ctx.globalAlpha = 1;
      drawBanner();

      if (state !== 'menu') drawHUD();
      if (state === 'menu') drawMenu();
      if (state === 'over') drawOver();
      if (state === 'paused') drawPaused();
      ctx.restore();
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    reset();
    if (document.fonts && document.fonts.load) {
      document.fonts.load(`800 20px 'Baloo 2'`).catch(() => {});
    }
    requestAnimationFrame(loop);
  })();
</script>
